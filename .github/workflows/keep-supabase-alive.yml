name: Supabase 깨어있게 유지하기

# 목적: Supabase 무료 요금제는 7일 동안 데이터베이스 요청이 없으면
# 프로젝트를 자동으로 일시정지시킨다. 이 워크플로가 매일 한 번 Supabase에
# 가벼운 조회 요청을 보내, 방문자가 없는 기간에도 절대 일시정지되지 않게 한다.
#
# 사용하는 키(apikey)는 index.html에도 그대로 노출되어 있는 "공개용" 키라
# 여기 그대로 적어둬도 안전하다(관리자 권한이 있는 비밀 키가 아님).

on:
  schedule:
    # 매일 UTC 03:00 = 한국시간(KST) 낮 12:00 에 실행
    - cron: '0 3 * * *'
  workflow_dispatch:
    # 이 줄 덕분에 GitHub 저장소의 Actions 탭에서 "Run workflow" 버튼으로
    # 원하는 때 수동으로도 실행해볼 수 있다.

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: site_content 테이블에서 1건만 가볍게 조회
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://rqcbqtguwpdodsiazgtn.supabase.co/rest/v1/site_content?select=key&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxY2JxdGd1d3Bkb2RzaWF6Z3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTI5MjgsImV4cCI6MjA5Nzk4ODkyOH0.FG0sXd8WzpuZWyI2IMtZK8x3Jfm3B-WEb75dZxHl0sg" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxY2JxdGd1d3Bkb2RzaWF6Z3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTI5MjgsImV4cCI6MjA5Nzk4ODkyOH0.FG0sXd8WzpuZWyI2IMtZK8x3Jfm3B-WEb75dZxHl0sg")
          echo "Supabase 응답 코드: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✔ 정상 응답 — 프로젝트가 깨어있는 상태로 유지됩니다."
          else
            echo "⚠ 예상과 다른 응답 코드입니다. Supabase 상태를 확인해 주세요."
            exit 1
          fi
