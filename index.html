<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="경력이 단절된 회계 전문가와 기업을 잇는 채용 매칭 플랫폼, APSP(회전문)입니다. 이력서 등록부터 구인공고, 매칭까지 한 곳에서 진행하세요."
    />
    <!-- Open Graph / 카카오톡·페이스북·슬랙 등에서 링크를 공유할 때
         보여줄 썸네일·제목·설명입니다. 이 사이트는 CRA로 만든
         클라이언트 렌더링(SPA) 사이트라 크롤러가 자바스크립트를
         실행하지 않고 이 정적 index.html만 읽어가므로, 모든 페이지가
         이 하나의 미리보기를 공유합니다(채용공고 등 개별 페이지마다
         다른 썸네일을 보여주려면 서버 사이드 렌더링/프리렌더링이
         추가로 필요합니다). og:image는 크롤러가 접근 가능해야 하므로
         반드시 절대 경로(https://apsp.co.kr/...)로 넣습니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APSP(회전문)" />
    <meta property="og:title" content="APSP(회전문) - 경력단절 회계인 재취업 매칭 플랫폼" />
    <meta
      property="og:description"
      content="경력이 단절된 회계 전문가와 기업을 잇는 채용 매칭 플랫폼입니다. 이력서 등록부터 구인공고, 매칭까지 한 곳에서 진행하세요."
    />
    <meta property="og:image" content="https://apsp.co.kr/images/banner_img1.jpg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:url" content="https://apsp.co.kr" />
    <meta property="og:locale" content="ko_KR" />
    <!-- 트위터(X)는 og: 태그를 대부분 fallback으로 읽지만, 명시적으로
         넣어두면 더 확실하게 카드가 뜹니다. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="APSP(회전문) - 경력단절 회계인 재취업 매칭 플랫폼" />
    <meta
      name="twitter:description"
      content="경력이 단절된 회계 전문가와 기업을 잇는 채용 매칭 플랫폼입니다."
    />
    <meta name="twitter:image" content="https://apsp.co.kr/images/banner_img1.jpg" />
    <!-- 배너 이미지(banner_img1.jpg)에 그려진 "경력단절 회계인을
         지원합니다." 문구가 명조 계열 서체라서, admin에서 입력하는
         배너 문구도 같은 느낌으로 보이도록 웹폰트를 불러옵니다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>회전문</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
